[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-osbc"
version = "0.1.0"
description = "Game automation framework for RuneScape-like games using computer vision and OCR"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Auto-OSBC Contributors"}
]
keywords = ["automation", "game", "bot", "computer-vision", "ocr", "runescape"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core dependencies
    "numpy>=1.23.1",
    "opencv-python>=4.5.4.60",
    "pillow>=9.3.0",
    "pyautogui>=0.9.53",
    "customtkinter>=5.1.3",
    "pynput>=1.7.6",
    "tkinter-tooltip>=2.1.0",

    # Window and GUI management
    "PyWinCtl>=0.0.42",
    "mss>=7.0.1",
    "pyclick>=0.0.2",

    # Utilities
    "requests>=2.31.0",
    "deprecated>=1.2.13",
    "pytweening>=1.2.0",
    "psutil>=5.9.4",
    "simplejson>=3.17.6",

    # Development tools (move some to dev extras)
    "mypy>=1.13.0",
    "flake8>=6.0.0",

    # Type stubs
    "types-PyAutoGUI>=0.9.3",
    "types-Deprecated>=1.2.10",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.0",
    "pytest-mock",
    "pytest-cov",
    "coverage",

    # Code quality
    "pre-commit>=2.20.0",
    "black>=22.12.0",
    "isort>=5.12.0",

    # Additional OpenCV for headless testing
    "opencv-python-headless>=4.5.4.60",

    # Analysis tools
    "pandas>=1.5.0",
    "matplotlib>=3.6.2",
]

linux = [
    # Linux-specific dependencies if needed in future
]

windows = [
    # Windows-specific dependencies if needed
]

[project.urls]
Homepage = "https://github.com/kelltom/Auto-OSBC"
Repository = "https://github.com/kelltom/Auto-OSBC"
Issues = "https://github.com/kelltom/Auto-OSBC/issues"

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 160
preview = true
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 160
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

# Type checking settings
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true

# Import settings
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = true
disallow_untyped_calls = true

# Warning settings
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Additional strictness flags
allow_redefinition = false
local_partial_types = true
implicit_reexport = false
strict_concatenate = true
strict_equality = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "utilities.*"
ignore_missing_imports = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.flake8]
max-line-length = 160
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]
ignore = ["E203", "E266", "E501", "W503"]
max-complexity = 10
